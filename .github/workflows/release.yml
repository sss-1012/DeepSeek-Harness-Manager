name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Windows installers
        shell: pwsh
        run: |
          # 无效的签名凭据会让 electron-builder 直接失败:
          #   "Env WIN_CSC_LINK is not correct, cannot resolve: <value>"
          # 因此 secret 未配置/占位符/写错时,先在本步骤内把它清掉,让构建走"不签名但继续"的路径。
          if ($env:WIN_CSC_LINK) {
            $link = $env:WIN_CSC_LINK
            $looksUsable = (Test-Path -LiteralPath $link) -or ($link -match '^(https?://|data:)')
            if (-not $looksUsable) {
              Write-Host "::warning::WIN_CSC_LINK 既不是存在的文件也不是 URL,已忽略(本次构建不会签名)"
              Remove-Item Env:WIN_CSC_LINK
              Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            } else {
              Write-Host "WIN_CSC_LINK 可用(长度 $($link.Length)),将尝试签名"
            }
          } else {
            Write-Host "未配置 WIN_CSC_LINK:构建产物不签名(用户会看到 SmartScreen 提示)"
          }
          npm run pack
        env:
          # Code-signing credentials. While these secrets are unset the build still succeeds
          # and only warns; once they exist, `npm run verify-signature:strict` fails if the
          # artifacts are unsigned, so an unrecognized-app (SmartScreen) build cannot be published.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify artifact signatures
        shell: pwsh
        run: |
          # 用 pwsh(PowerShell 7)而不是 powershell(5.1):后者在 pwsh 父进程下会因 PSModulePath
          # 继承而加载不了 Microsoft.PowerShell.Security,导致 Get-AuthenticodeSignature 不可用。
          # 只报告、不阻塞发布:凭据有效却没签上时用 strict 让它红,方便发现配置问题。
          if ($env:WIN_CSC_LINK) {
            pwsh -NoProfile -File scripts/verify-signature.ps1 -RequireSigned
          } else {
            pwsh -NoProfile -File scripts/verify-signature.ps1
          }
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash, $_.Name
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Create Release
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/*.exe dist/SHA256SUMS.txt `
            --title "DeepSeek Harness Manager ${{ github.ref_name }}" `
            --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
